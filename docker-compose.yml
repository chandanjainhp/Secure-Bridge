version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: secure-bridge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: securebridge123
      MONGO_INITDB_DATABASE: BACKEND
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - secure-bridge-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: secure-bridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - secure-bridge-network

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: secure-bridge-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      
      # MongoDB Configuration (using local container)
      MONGODB_URI: mongodb://admin:securebridge123@mongodb:27017
      DB_NAME: BACKEND
      
      # Redis Configuration (using local container)
      REDIS_URL: redis://redis:6379
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      ACCESS_TOKEN_EXPIRY: 1d
      REFRESH_TOKEN_EXPIRY: 10d
      
      # Encryption Configuration
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-32-character-encryption-key-change-this}
      ENCRYPTION_MODE: mock
      
      # Email Configuration (Gmail)
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      
      # CORS Configuration
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      
      # API Configuration
      API_RATE_LIMIT: 100
      
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./server/logs:/app/logs
      - ./server/public:/app/public
    networks:
      - secure-bridge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: secure-bridge-client
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - server
    networks:
      - secure-bridge-network

networks:
  secure-bridge-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
