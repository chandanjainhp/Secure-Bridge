services:
  mongodb:
    image: mongo:7
    container_name: secure-bridge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: Secure-Bridge
    networks:
      - secure-bridge-network

  # Optional: MongoDB Express UI for browsing the database
  mongo-express:
    image: mongo-express:1.0
    container_name: secure-bridge-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/Secure-Bridge?authSource=admin
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - secure-bridge-network
    profiles:
      - tools

  redis:
    image: redis:7-alpine
    container_name: secure-bridge-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - secure-bridge-network

networks:
  secure-bridge-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
