[project]
name = "secure-bridge-mcp"
version = "0.1.0"
description = "Secure Bridge MCP server — FastMCP tools that respect the project outbound allowlist and security model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Secure Bridge Team" }]
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
secure-bridge-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.tools"]

[tool.setuptools.package-dir]
server = "src"
"server.tools" = "src/tools"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
